name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Syntax and documentation links
        run: node scripts/check.mjs
      - name: Unit and integration tests
        run: node --test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example --profile tls config --quiet
          docker compose -f compose.demo.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.transcode.yaml -f compose.nvidia.yaml config --quiet
      - name: Build application image
        run: docker build --tag roadtrip:test .
      - name: Build transcoding image and exercise real FFmpeg
        run: |
          docker build -f Dockerfile.transcode --tag roadtrip:transcode-test .
          docker run --rm --volume "$PWD/scripts:/app/scripts:ro" roadtrip:transcode-test node scripts/smoke-transcode.mjs
      - name: Start demo container
        run: docker run --detach --name roadtrip-smoke --publish 127.0.0.1:8878:8787 --env DEMO_MODE=true --env HOST=0.0.0.0 --env APP_ORIGIN=http://localhost:8878 roadtrip:test
      - name: Exercise container HTTP endpoints
        run: node scripts/smoke-demo.mjs http://localhost:8878
      - name: Validate Caddy configuration
        run: docker run --rm --env APP_HOST=roadtrip.home.arpa --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Container logs
        if: always()
        run: docker logs roadtrip-smoke || true
      - name: Stop test container
        if: always()
        run: docker rm --force roadtrip-smoke || true
